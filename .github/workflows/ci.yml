name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck backend and client
        run: npm run typecheck

      - name: Run Steam recovery policy tests
        run: npm test
      - name: Build local runtime
        run: npm run build

      - name: Smoke-test HTTP server
        shell: bash
        run: |
          set -euo pipefail
          O_IDLE_DISABLE_BROWSER=1 node dist/src/server.js > /tmp/o-steam-idle.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3210/health | grep -q '^ok$'; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/o-steam-idle.log
          exit 1

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Test Cloudflare state normalization
        working-directory: cloudflare
        run: |
          npx tsc --target es2022 --module commonjs --skipLibCheck --outDir /tmp/o-idle-cloud-test src/cloud-state.ts
          node --input-type=commonjs -e "const assert=require('node:assert/strict');const {initialCloudConfig,normalizeCloudConfig}=require('/tmp/o-idle-cloud-test/cloud-state.js');const s=initialCloudConfig({O_IDLE_DEFAULT_APPIDS:'1,2,3',O_IDLE_PRIORITY_APPIDS:'2',O_IDLE_AUTO_START:'1'});assert.deepEqual(s.priorityAppIds,[2]);assert.equal(s.idleWanted,true);assert.equal(normalizeCloudConfig({...s,idleWanted:false}).idleWanted,false);"

      - name: Typecheck Cloudflare Worker
        working-directory: cloudflare
        run: npm run typecheck
