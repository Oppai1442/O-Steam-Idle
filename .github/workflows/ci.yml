name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck backend and client
        run: npm run typecheck

      - name: Build local runtime
        run: npm run build

      - name: Smoke-test HTTP server
        shell: bash
        run: |
          set -euo pipefail
          O_IDLE_DISABLE_BROWSER=1 node dist/src/server.js > /tmp/o-steam-idle.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3210/health | grep -q '^ok$'; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/o-steam-idle.log
          exit 1

      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Typecheck Cloudflare Worker
        working-directory: cloudflare
        run: npm run typecheck
