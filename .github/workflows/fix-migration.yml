name: Repair TypeScript migration workflow

on:
  push:
    branches: [ts-migration]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ts-migration
      - name: Remove setup-node cache dependency on missing lockfile
        run: |
          sed -i '/^[[:space:]]*cache: npm[[:space:]]*$/d' .github/workflows/migrate-typescript.yml
          rm -f .github/workflows/fix-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair TypeScript migration workflow"
          git push origin HEAD:ts-migration
