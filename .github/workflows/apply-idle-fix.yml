name: Apply Steam idle fix

on:
  push:
    branches: [fix/steam-32-rotation]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair migration tail and apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-steam-idle-limit-fix.cjs')
          s = p.read_text()
          start = s.index("let readme = read('README.md');")
          end_marker = "write('README.md', readme);"
          end = s.index(end_marker, start) + len(end_marker)
          replacement = r'''let readme = read('README.md');
          const marker = '## Cloudflare Container mode';
          if (!readme.includes(marker)) throw new Error('README Cloudflare marker missing');
          if (!readme.includes('Steam concurrency and playtime')) {
            const note = [
              '## Steam concurrency and playtime',
              '',
              'Steam presence has a finite simultaneous-app capacity. O-Steam-Idle keeps at most 32 games ACTIVE at a time and round-robins larger selections in 30-minute batches by default. Games waiting for their turn are shown as QUEUED instead of LIVE.',
              '',
              'Set O_IDLE_ROTATE_MINUTES to change the batch duration or O_IDLE_MAX_CONCURRENT to use a lower cap. The app never requests more than 32 concurrent AppIDs.',
              '',
              'Playtime shown in the UI is a Steam snapshot, not a local stopwatch. While idling, O-Steam-Idle refreshes that snapshot every 5 minutes by default (O_IDLE_PLAYTIME_SYNC_MINUTES). Steam can still publish playtime asynchronously, so an ACTIVE batch may not show an immediate counter change.',
              '',
              marker
            ].join('\\n');
            readme = readme.replace(marker, note);
          }
          write('README.md', readme);'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          node scripts/apply-steam-idle-limit-fix.cjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          O_IDLE_DISABLE_BROWSER=1 node dist/src/server.js > /tmp/o-steam-idle.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3210/health | grep -q '^ok$'; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:3210/health | grep -q '^ok$'
      - name: Commit generated fix
        shell: bash
        run: |
          rm -f scripts/apply-steam-idle-limit-fix.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: batch Steam idle sessions and refresh playtime"
          git push origin HEAD:fix/steam-32-rotation
