name: Bootstrap repository

on:
  push:
    paths:
      - DEPLOY_BUNDLE

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack O-Steam-Idle
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/part* | base64 -d > /tmp/o-steam-idle.zip
          mkdir -p /tmp/o-steam-idle
          unzip -q /tmp/o-steam-idle.zip -d /tmp/o-steam-idle
          cp -a /tmp/o-steam-idle/. .
          rm -rf .bundle DEPLOY_BUNDLE .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: launch O-Steam-Idle v0.2.0"
          git push
